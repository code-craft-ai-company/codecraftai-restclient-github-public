[tool.poetry]
name = "codecraftai-restclient-github-public"
description = "Code Craft AI -  Rest Client for Github (public)"
version = "1.0.0"
authors = ["Myron Walker <myron.walker@gmail.com>"]
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Dual-License"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
requests = "^2.32.4"
codecraftai-errors = { version = "<2.0.0", source = "codecraftai" }
codecraftai-credentials = { version = "<2.0.0", source = "codecraftai" }
codecraftai-restclient-base = { version = "<2.0.0", source = "codecraftai" }


[tool.poetry.group.dev.dependencies]

[tool.poetry.group.dbio.dependencies]


[[tool.poetry.source]]
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
